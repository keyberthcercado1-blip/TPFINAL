<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DesarrollAr | Iniciar Sesión</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1 class="logo"> DesarrollAr</h1>
            <h2>Iniciar Sesión</h2>
            
            <form class="login-form">
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="daniela.biz@desarrollAr.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="1234" required>
                </div>

                <button type="submit" class="btn-primary">Ingresar al Perfil</button>
            </form>

            <p class="links">
                <a href="#" class="forgot-password">¿Olvidaste tu Contraseña?</a>
                </p>
                  <span class="divider">|</span>
                <a href="register.html" class="register-link">¿No tienes cuenta? Regístrate aquí</a> 
            </p>
        </div>
    </div>


    <script src="login.js"></script> 
</body>
</html>
