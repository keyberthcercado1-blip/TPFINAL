<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DesarrollAr | Crear Cuenta</title>
    <link rel="stylesheet" href="register.css"> </head>
<body>
    <div class="register-container">
        <div class="register-card">
            <h1 class="logo">D DesarrollAr</h1>
            <h2>Crea tu Cuenta</h2>
            
            <form class="register-form">
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="tu.email@ejemplo.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required>
                </div>

                <div class="input-group">
                    <label for="confirm-password">Confirmar Contraseña</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Repite tu contraseña" required>
                </div>

                <button type="submit" class="btn-primary">Registrarse</button>
            </form>

           
          <p class="links">
                Ya tengo cuenta. <a href="login.html" class="login-link">Iniciar Sesión</a>
            </p>
           
        </div>
    </div>


</body>

</html>
